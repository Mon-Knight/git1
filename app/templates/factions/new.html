<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建势力 — {{ world.name }} — AI World Engine</title>
<link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<div class="container">
<header class="header"><h1 class="logo">🏛️ {{ world.name }}</h1><p class="subtitle">创建势力</p></header>
<nav class="nav"><a href="/worlds/{{ world.id }}/factions" class="nav-link">← 返回势力列表</a></nav>
<main class="main">
<form action="/worlds/{{ world.id }}/factions" method="post" class="world-form">
    <div class="form-group {% if errors.name %}has-error{% endif %}">
        <label for="name">名称 <span class="required">*</span></label>
        <input type="text" id="name" name="name" value="{{ form_data.name if form_data else '' }}" maxlength="100" required>
        {% if errors.name %}<span class="error-msg">{{ errors.name }}</span>{% endif %}
    </div>
    <div class="form-group">
        <label for="faction_type">类型</label>
        <select id="faction_type" name="faction_type">
            <option value="">-- 请选择 --</option>
            {% set types = ['王国', '帝国', '共和国', '组织', '家族', '教派', '联盟', '部落', '其他'] %}
            {% for t in types %}
            <option value="{{ t }}" {% if form_data and form_data.faction_type == t %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="leader_id">领袖</label>
        <select id="leader_id" name="leader_id">
            <option value="">-- 无 --</option>
            {% for c in characters %}
            <option value="{{ c.id }}" {% if form_data and form_data.leader_id|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group"><label for="goal">目标</label><textarea id="goal" name="goal" rows="2">{{ form_data.goal if form_data else '' }}</textarea></div>
    <div class="form-group"><label for="resources">资源</label><textarea id="resources" name="resources" rows="2">{{ form_data.resources if form_data else '' }}</textarea></div>
    <div class="form-group"><label for="enemies">敌对势力</label><textarea id="enemies" name="enemies" rows="2" placeholder="描述敌对势力…">{{ form_data.enemies if form_data else '' }}</textarea></div>
    <div class="form-group"><label for="allies">盟友</label><textarea id="allies" name="allies" rows="2" placeholder="描述盟友…">{{ form_data.allies if form_data else '' }}</textarea></div>
    <div class="form-group"><label for="notes">备注</label><textarea id="notes" name="notes" rows="2">{{ form_data.notes if form_data else '' }}</textarea></div>
    <div class="form-actions"><button type="submit" class="btn-primary">创建势力</button><a href="/worlds/{{ world.id }}/factions" class="btn-secondary">取消</a></div>
</form>
</main>
<footer class="footer"><p>AI World Engine | <a href="/">返回首页</a></p></footer>
</div></body></html>
