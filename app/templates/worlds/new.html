<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建世界 — AI World Engine</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">🌍 AI World Engine</h1>
            <p class="subtitle">创建新世界</p>
        </header>

        <nav class="nav">
            <a href="/worlds" class="nav-link">← 返回世界列表</a>
        </nav>

        <main class="main">
            <form action="/worlds" method="post" class="world-form">
                <div class="form-group {% if errors.name %}has-error{% endif %}">
                    <label for="name">世界名称 <span class="required">*</span></label>
                    <input type="text" id="name" name="name" value="{{ form_data.name if form_data else '' }}" placeholder="例如：艾泽拉斯" maxlength="100" required>
                    {% if errors.name %}<span class="error-msg">{{ errors.name }}</span>{% endif %}
                </div>

                <div class="form-group {% if errors.world_type %}has-error{% endif %}">
                    <label for="world_type">世界类型</label>
                    <select id="world_type" name="world_type">
                        <option value="">-- 请选择 --</option>
                        {% set types = ['奇幻', '科幻', '修仙', '都市', '末世', '武侠', '历史', '架空', '其他'] %}
                        {% for t in types %}
                        <option value="{{ t }}" {% if form_data and form_data.world_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                    {% if errors.world_type %}<span class="error-msg">{{ errors.world_type }}</span>{% endif %}
                </div>

                <div class="form-group">
                    <label for="description">世界简介</label>
                    <textarea id="description" name="description" rows="4" placeholder="简要描述你的世界…">{{ form_data.description if form_data else '' }}</textarea>
                </div>

                <div class="form-group {% if errors.current_era %}has-error{% endif %}">
                    <label for="current_era">当前时代</label>
                    <input type="text" id="current_era" name="current_era" value="{{ form_data.current_era if form_data else '' }}" placeholder="例如：第三纪元、蒸汽时代" maxlength="100">
                    {% if errors.current_era %}<span class="error-msg">{{ errors.current_era }}</span>{% endif %}
                </div>

                <div class="form-group {% if errors.tone %}has-error{% endif %}">
                    <label for="tone">世界基调</label>
                    <select id="tone" name="tone">
                        <option value="">-- 请选择 --</option>
                        {% set tones = ['史诗', '黑暗', '光明', '中性', '幽默', '悲剧', '悬疑'] %}
                        {% for t in tones %}
                        <option value="{{ t }}" {% if form_data and form_data.tone == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                    {% if errors.tone %}<span class="error-msg">{{ errors.tone }}</span>{% endif %}
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">创建世界</button>
                    <a href="/worlds" class="btn-secondary">取消</a>
                </div>
            </form>
        </main>

        <footer class="footer">
            <p>AI World Engine | <a href="/">返回首页</a></p>
        </footer>
    </div>
</body>
</html>
