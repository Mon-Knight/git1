<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑地点 — {{ location.name }} — AI World Engine</title>
<link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<div class="container">
<header class="header"><h1 class="logo">🗺️ {{ world.name }}</h1><p class="subtitle">编辑地点：{{ location.name }}</p></header>
<nav class="nav"><a href="/worlds/{{ world.id }}/locations/{{ location.id }}" class="nav-link">← 返回地点详情</a></nav>
<main class="main">
<form action="/worlds/{{ world.id }}/locations/{{ location.id }}/edit" method="post" class="world-form">
    <div class="form-group {% if errors.name %}has-error{% endif %}">
        <label for="name">名称 <span class="required">*</span></label>
        <input type="text" id="name" name="name" value="{{ location.name }}" maxlength="100" required>
        {% if errors.name %}<span class="error-msg">{{ errors.name }}</span>{% endif %}
    </div>
    <div class="form-group">
        <label for="location_type">类型</label>
        <select id="location_type" name="location_type">
            <option value="">-- 请选择 --</option>
            {% set types = ['城市', '国家', '遗迹', '森林', '山脉', '海洋', '地下城', '神殿', '其他'] %}
            {% for t in types %}<option value="{{ t }}" {% if location.location_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group"><label for="region">所属区域</label><input type="text" id="region" name="region" value="{{ location.region }}"></div>
    <div class="form-group"><label for="description">描述</label><textarea id="description" name="description" rows="3">{{ location.description }}</textarea></div>
    <div class="form-group">
        <label for="controlling_faction_id">控制势力</label>
        <select id="controlling_faction_id" name="controlling_faction_id">
            <option value="">-- 无 --</option>
            {% for f in factions %}<option value="{{ f.id }}" {% if location.controlling_faction_id == f.id %}selected{% endif %}>{{ f.name }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group"><label for="important_events">重要事件</label><textarea id="important_events" name="important_events" rows="2">{{ location.important_events }}</textarea></div>
    <div class="form-actions"><button type="submit" class="btn-primary">保存修改</button><a href="/worlds/{{ world.id }}/locations/{{ location.id }}" class="btn-secondary">取消</a></div>
</form>
</main>
<footer class="footer"><p>AI World Engine | <a href="/">返回首页</a></p></footer>
</div></body></html>
