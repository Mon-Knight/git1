<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建地点 — {{ world.name }} — AI World Engine</title>
<link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<div class="container">
<header class="header"><h1 class="logo">🗺️ {{ world.name }}</h1><p class="subtitle">创建地点</p></header>
<nav class="nav"><a href="/worlds/{{ world.id }}/locations" class="nav-link">← 返回地点列表</a></nav>
<main class="main">
<form action="/worlds/{{ world.id }}/locations" method="post" class="world-form">
    <div class="form-group {% if errors.name %}has-error{% endif %}">
        <label for="name">名称 <span class="required">*</span></label>
        <input type="text" id="name" name="name" value="{{ form_data.name if form_data else '' }}" maxlength="100" required>
        {% if errors.name %}<span class="error-msg">{{ errors.name }}</span>{% endif %}
    </div>
    <div class="form-group">
        <label for="location_type">类型</label>
        <select id="location_type" name="location_type">
            <option value="">-- 请选择 --</option>
            {% set types = ['城市', '国家', '遗迹', '森林', '山脉', '海洋', '地下城', '神殿', '其他'] %}
            {% for t in types %}<option value="{{ t }}" {% if form_data and form_data.location_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group"><label for="region">所属区域</label><input type="text" id="region" name="region" value="{{ form_data.region if form_data else '' }}" placeholder="例如：北方大陆"></div>
    <div class="form-group"><label for="description">描述</label><textarea id="description" name="description" rows="3">{{ form_data.description if form_data else '' }}</textarea></div>
    <div class="form-group">
        <label for="controlling_faction_id">控制势力</label>
        <select id="controlling_faction_id" name="controlling_faction_id">
            <option value="">-- 无 --</option>
            {% for f in factions %}<option value="{{ f.id }}" {% if form_data and form_data.controlling_faction_id|string == f.id|string %}selected{% endif %}>{{ f.name }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group"><label for="important_events">重要事件</label><textarea id="important_events" name="important_events" rows="2">{{ form_data.important_events if form_data else '' }}</textarea></div>
    <div class="form-actions"><button type="submit" class="btn-primary">创建地点</button><a href="/worlds/{{ world.id }}/locations" class="btn-secondary">取消</a></div>
</form>
</main>
<footer class="footer"><p>AI World Engine | <a href="/">返回首页</a></p></footer>
</div></body></html>
