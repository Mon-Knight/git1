<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建角色 — {{ world.name }} — AI World Engine</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
<header class="header"><h1 class="logo">👥 {{ world.name }}</h1><p class="subtitle">创建角色</p></header>
<nav class="nav"><a href="/worlds/{{ world.id }}/characters" class="nav-link">← 返回角色列表</a></nav>
<main class="main">
<form action="/worlds/{{ world.id }}/characters" method="post" class="world-form">
    <div class="form-group {% if errors.name %}has-error{% endif %}">
        <label for="name">姓名 <span class="required">*</span></label>
        <input type="text" id="name" name="name" value="{{ form_data.name if form_data else '' }}" maxlength="100" required>
        {% if errors.name %}<span class="error-msg">{{ errors.name }}</span>{% endif %}
    </div>
    <div class="form-group">
        <label for="role">身份</label>
        <input type="text" id="role" name="role" value="{{ form_data.role if form_data else '' }}" placeholder="例如：战士、法师、国王">
    </div>
    <div class="form-group">
        <label for="faction_id">所属势力</label>
        <select id="faction_id" name="faction_id">
            <option value="">-- 未加入势力 --</option>
            {% for f in factions %}
            <option value="{{ f.id }}" {% if form_data and form_data.faction_id|string == f.id|string %}selected{% endif %}>{{ f.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="personality">性格</label>
        <textarea id="personality" name="personality" rows="2">{{ form_data.personality if form_data else '' }}</textarea>
    </div>
    <div class="form-group">
        <label for="goal">目标</label>
        <textarea id="goal" name="goal" rows="2">{{ form_data.goal if form_data else '' }}</textarea>
    </div>
    <div class="form-group">
        <label for="abilities">能力</label>
        <textarea id="abilities" name="abilities" rows="2">{{ form_data.abilities if form_data else '' }}</textarea>
    </div>
    <div class="form-group">
        <label for="current_status">当前状态</label>
        <select id="current_status" name="current_status">
            {% set statuses = ['存活', '死亡', '失踪', '封印', '转生', '其他'] %}
            {% for s in statuses %}
            <option value="{{ s }}" {% if form_data and form_data.current_status == s %}selected{% elif not form_data and s == '存活' %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="notes">备注</label>
        <textarea id="notes" name="notes" rows="2">{{ form_data.notes if form_data else '' }}</textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">创建角色</button>
        <a href="/worlds/{{ world.id }}/characters" class="btn-secondary">取消</a>
    </div>
</form>
</main>
<footer class="footer"><p>AI World Engine | <a href="/">返回首页</a></p></footer>
</div>
</body>
</html>
