<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑角色 — {{ character.name }} — AI World Engine</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
<header class="header"><h1 class="logo">👥 {{ world.name }}</h1><p class="subtitle">编辑角色：{{ character.name }}</p></header>
<nav class="nav"><a href="/worlds/{{ world.id }}/characters/{{ character.id }}" class="nav-link">← 返回角色详情</a></nav>
<main class="main">
<form action="/worlds/{{ world.id }}/characters/{{ character.id }}/edit" method="post" class="world-form">
    <div class="form-group {% if errors.name %}has-error{% endif %}">
        <label for="name">姓名 <span class="required">*</span></label>
        <input type="text" id="name" name="name" value="{{ character.name }}" maxlength="100" required>
        {% if errors.name %}<span class="error-msg">{{ errors.name }}</span>{% endif %}
    </div>
    <div class="form-group">
        <label for="role">身份</label>
        <input type="text" id="role" name="role" value="{{ character.role }}">
    </div>
    <div class="form-group">
        <label for="faction_id">所属势力</label>
        <select id="faction_id" name="faction_id">
            <option value="">-- 未加入势力 --</option>
            {% for f in factions %}
            <option value="{{ f.id }}" {% if character.faction_id == f.id %}selected{% endif %}>{{ f.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group"><label for="personality">性格</label><textarea id="personality" name="personality" rows="2">{{ character.personality }}</textarea></div>
    <div class="form-group"><label for="goal">目标</label><textarea id="goal" name="goal" rows="2">{{ character.goal }}</textarea></div>
    <div class="form-group"><label for="abilities">能力</label><textarea id="abilities" name="abilities" rows="2">{{ character.abilities }}</textarea></div>
    <div class="form-group">
        <label for="current_status">当前状态</label>
        <select id="current_status" name="current_status">
            {% set statuses = ['存活', '死亡', '失踪', '封印', '转生', '其他'] %}
            {% for s in statuses %}
            <option value="{{ s }}" {% if character.current_status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group"><label for="notes">备注</label><textarea id="notes" name="notes" rows="2">{{ character.notes }}</textarea></div>
    <div class="form-actions">
        <button type="submit" class="btn-primary">保存修改</button>
        <a href="/worlds/{{ world.id }}/characters/{{ character.id }}" class="btn-secondary">取消</a>
    </div>
</form>
</main>
<footer class="footer"><p>AI World Engine | <a href="/">返回首页</a></p></footer>
</div>
</body>
</html>
