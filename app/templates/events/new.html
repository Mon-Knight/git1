<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建事件 — {{ world.name }} — AI World Engine</title>
<link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<div class="container">
<header class="header"><h1 class="logo">📜 {{ world.name }}</h1><p class="subtitle">创建历史事件</p></header>
<nav class="nav"><a href="/worlds/{{ world.id }}/events" class="nav-link">← 返回事件列表</a></nav>
<main class="main">
<form action="/worlds/{{ world.id }}/events" method="post" class="world-form">
    <div class="form-group {% if errors.title %}has-error{% endif %}">
        <label for="title">事件标题 <span class="required">*</span></label>
        <input type="text" id="title" name="title" value="{{ form_data.title if form_data else '' }}" maxlength="150" required>
        {% if errors.title %}<span class="error-msg">{{ errors.title }}</span>{% endif %}
    </div>
    <div class="form-group">
        <label for="event_time">发生时间</label>
        <input type="text" id="event_time" name="event_time" value="{{ form_data.event_time if form_data else '' }}" placeholder="例如：2024-03-15 或 帝国历三年">
    </div>
    <div class="form-group">
        <label for="location_id">地点</label>
        <select id="location_id" name="location_id">
            <option value="">-- 无 --</option>
            {% for loc in locations %}<option value="{{ loc.id }}" {% if form_data and form_data.location_id|string == loc.id|string %}selected{% endif %}>{{ loc.name }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group"><label for="involved_characters">涉及角色</label><textarea id="involved_characters" name="involved_characters" rows="2" placeholder="角色名称，用逗号分隔">{{ form_data.involved_characters if form_data else '' }}</textarea></div>
    <div class="form-group"><label for="involved_factions">涉及势力</label><textarea id="involved_factions" name="involved_factions" rows="2" placeholder="势力名称，用逗号分隔">{{ form_data.involved_factions if form_data else '' }}</textarea></div>
    <div class="form-group"><label for="content">事件内容</label><textarea id="content" name="content" rows="4" placeholder="详细描述事件经过…">{{ form_data.content if form_data else '' }}</textarea></div>
    <div class="form-group"><label for="consequences">影响结果</label><textarea id="consequences" name="consequences" rows="2" placeholder="事件造成的影响…">{{ form_data.consequences if form_data else '' }}</textarea></div>
    <div class="form-group">
        <label for="is_canon">是否正史</label>
        <select id="is_canon" name="is_canon">
            <option value="true" {% if not form_data or form_data.is_canon == 'true' %}selected{% endif %}>是（正史）</option>
            <option value="false" {% if form_data and form_data.is_canon == 'false' %}selected{% endif %}>否（非正史）</option>
        </select>
    </div>
    <div class="form-actions"><button type="submit" class="btn-primary">创建事件</button><a href="/worlds/{{ world.id }}/events" class="btn-secondary">取消</a></div>
</form>
</main>
<footer class="footer"><p>AI World Engine | <a href="/">返回首页</a></p></footer>
</div></body></html>
