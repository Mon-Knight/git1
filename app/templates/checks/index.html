<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检查中心 — {{ world.name }} — AI World Engine</title>
<link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<div class="container">
<header class="header"><h1 class="logo">🔍 {{ world.name }}</h1><p class="subtitle">检查中心</p></header>
<nav class="nav"><a href="/worlds/{{ world.id }}" class="nav-link">← 返回世界详情</a></nav>
<main class="main">
<div class="module-grid">
    <a href="/worlds/{{ world.id }}/checks/conflicts" class="module-card">
        <div class="module-icon">⚠️</div><h3>设定矛盾检查</h3>
        <p>检查新设定是否与已有世界规则、历史事件、角色状态、势力关系冲突</p>
    </a>
    <a href="/worlds/{{ world.id }}/checks/behavior" class="module-card">
        <div class="module-icon">🎭</div><h3>角色行为合理性检查</h3>
        <p>检查角色行为是否符合其性格、目标、能力和当前状态</p>
    </a>
</div>
<div class="info-card" style="margin-top:1.5rem;background:rgba(255,193,7,0.05);border-color:rgba(255,193,7,0.2)">
    <h3>⚠️ 重要提示</h3><p style="color:var(--color-text-muted)">所有检查结果仅供参考，不会自动修改数据库中的任何设定。检查功能只读取当前世界的数据进行分析。</p>
</div>
</main>
<footer class="footer"><p>AI World Engine | <a href="/">返回首页</a></p></footer>
</div></body></html>
